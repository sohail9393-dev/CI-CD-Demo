name: My CICD pipeline in Github Actions

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: check the Docker installation
        run: |
          docker
          docker images

      - name: run docker container
        run: |
          docker run hello-world
          uname -a

